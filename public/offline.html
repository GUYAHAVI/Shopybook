<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopybook - Offline</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #020258;
            --primary-light: #13e8e9;
            --primary-dark: #010138;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-light));
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }
        
        .offline-container {
            background: white;
            border-radius: 20px;
            padding: 3rem;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
        }
        
        .offline-icon {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-light));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
            color: white;
            font-size: 3rem;
        }
        
        .offline-title {
            color: var(--primary-color);
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }
        
        .offline-message {
            color: #666;
            font-size: 1.1rem;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        
        .offline-features {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            text-align: left;
        }
        
        .offline-features h5 {
            color: var(--primary-color);
            margin-bottom: 1rem;
            font-weight: 600;
        }
        
        .feature-item {
            display: flex;
            align-items: center;
            margin-bottom: 0.75rem;
            color: #555;
        }
        
        .feature-item i {
            color: var(--primary-light);
            margin-right: 0.75rem;
            width: 20px;
        }
        
        .retry-button {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-light));
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 10px;
            font-weight: 600;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-right: 1rem;
        }
        
        .retry-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(2, 2, 88, 0.3);
        }
        
        .offline-button {
            background: transparent;
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
            padding: 1rem 2rem;
            border-radius: 10px;
            font-weight: 600;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .offline-button:hover {
            background: var(--primary-color);
            color: white;
        }
        
        .connection-status {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #dc3545;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 25px;
            font-size: 0.9rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        @media (max-width: 768px) {
            .offline-container {
                padding: 2rem;
                margin: 1rem;
            }
            
            .offline-title {
                font-size: 1.5rem;
            }
            
            .offline-icon {
                width: 80px;
                height: 80px;
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="connection-status">
        <i class="fas fa-wifi-slash"></i>
        <span>Offline</span>
    </div>
    
    <div class="offline-container">
        <div class="offline-icon">
            <i class="fas fa-wifi-slash"></i>
        </div>
        
        <h1 class="offline-title">You're Offline</h1>
        
        <p class="offline-message">
            Don't worry! Shopybook works offline too. You can still access your cached data and perform basic operations.
        </p>
        
        <div class="offline-features">
            <h5><i class="fas fa-check-circle me-2"></i>Available Offline:</h5>
            <div class="feature-item">
                <i class="fas fa-box"></i>
                <span>View your products and inventory</span>
            </div>
            <div class="feature-item">
                <i class="fas fa-users"></i>
                <span>Access customer information</span>
            </div>
            <div class="feature-item">
                <i class="fas fa-chart-line"></i>
                <span>View cached reports and analytics</span>
            </div>
            <div class="feature-item">
                <i class="fas fa-cog"></i>
                <span>Access settings and preferences</span>
            </div>
        </div>
        
        <div class="d-flex justify-content-center flex-wrap gap-2">
            <button class="retry-button" onclick="retryConnection()">
                <i class="fas fa-sync-alt me-2"></i>Try Again
            </button>
            <button class="offline-button" onclick="continueOffline()">
                <i class="fas fa-desktop me-2"></i>Continue Offline
            </button>
        </div>
    </div>
    
    <script>
        // Check connection status
        function updateConnectionStatus() {
            const statusElement = document.querySelector('.connection-status');
            if (navigator.onLine) {
                statusElement.style.background = '#28a745';
                statusElement.innerHTML = '<i class="fas fa-wifi"></i><span>Online</span>';
                setTimeout(() => {
                    window.location.reload();
                }, 1000);
            } else {
                statusElement.style.background = '#dc3545';
                statusElement.innerHTML = '<i class="fas fa-wifi-slash"></i><span>Offline</span>';
            }
        }
        
        // Retry connection
        function retryConnection() {
            const button = event.target;
            const originalText = button.innerHTML;
            
            button.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Connecting...';
            button.disabled = true;
            
            // Simulate connection check
            setTimeout(() => {
                if (navigator.onLine) {
                    window.location.reload();
                } else {
                    button.innerHTML = originalText;
                    button.disabled = false;
                    alert('Still offline. Please check your internet connection.');
                }
            }, 2000);
        }
        
        // Continue offline
        function continueOffline() {
            // Try to load the main app from cache
            window.location.href = '/';
        }
        
        // Listen for online/offline events
        window.addEventListener('online', updateConnectionStatus);
        window.addEventListener('offline', updateConnectionStatus);
        
        // Initial status check
        updateConnectionStatus();
        
        // Periodic connection check
        setInterval(() => {
            if (navigator.onLine) {
                updateConnectionStatus();
            }
        }, 5000);
    </script>
</body>
</html>
